[Service]
# Cap at ~4 of 8 cores so a re-index storm can never starve the MCP query
# server or the box. Nice lowers scheduling priority vs interactive work.
CPUQuota=400%
Nice=10

# Memory ceiling, added 2026-08-03. On 2026-07-24 the indexer grew to 15.4 GB
# on a 16 GB box and the GLOBAL OOM killer fired -- it happened to pick the
# indexer, but it could just as easily have taken mcp_server or tailscaled.
# MemoryHigh throttles and reclaims first; MemoryMax kills only THIS cgroup,
# so the blast radius is the indexer instead of the whole machine.
# Restart=always in the unit brings it back, and since the observer now starts
# before the scan there is no longer a blind window after a restart.
MemoryHigh=6G
MemoryMax=8G

# print() was block-buffered under systemd, so a single log line could sit in
# the buffer for hours -- "no log line" was repeatedly mistaken for "did not
# happen". Real-time logs make the startup scan observable.
Environment=PYTHONUNBUFFERED=1

# The startup rescan is heavy on disk and competes with rsync/restic backups
# landing in the corpus. Idle I/O yields to them instead of fighting.
IOSchedulingClass=idle
IOSchedulingPriority=7

# Torch/OMP defaults to one thread per core; under CPUQuota=400% the extra
# threads only add allocator arenas and context switches. Cap to match quota.
Environment=OMP_NUM_THREADS=4
Environment=MKL_NUM_THREADS=4

# Weekly hygiene restart (2026-08-04): the Chroma DB lives in-process, so RSS
# has a floor that grows with the corpus, and glibc fragmentation accumulates
# over long runs. Restart=always brings it back; the startup scan resumes via
# the per-file hash cache, so a restart costs one idle-IO rescan, not a rebuild.
RuntimeMaxSec=7d
